<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To-Do List</title>
</head>
<body>
    <main>
        <header>
            <h1>Lista de Tarefas Personalizável</h1>
        </header>

        <section aria-labelledby="input-heading">
            <h2 id="input-heading">Adicione seus itens abaixo</h2>
            <form id="todo-form">
                <label for="todo-input">Nova tarefa:</label>
                <input type="text" id="todo-input" placeholder="Ex: Estudar JavaScript" required>
                <button type="submit">Adicionar</button>
            </form>
        </section>

        <!-- Seção de Exibição: Onde a mágica acontece -->
        <section aria-labelledby="list-heading">
            <h2 id="list-heading">Suas tarefas:</h2>
            <ul id="todo-list">
                
            </ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
