<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To-Do List</title>
</head>
<body>
    <main>
        <header>
            <h1>Lista de compras</h1>
        </header>

        <section aria-labelledby="input-heading">
            <h2 id="input-heading">Adicione os itens abaixo</h2>
            <form id="todo-form">
                <label for="todo-input">Item:</label>
                <input type="text" id="todo-input" placeholder="Ex: Arroz" required>
                <label for="todo-input">Valor:</label>
                <input type="number" id="todo-input" placeholder="Ex: R$ 12,50" required>
                <label for="todo-input">Quantidade:</label>
                <input type="number" id="todo-input" placeholder="Ex: 1" required>
                <button type="submit">Adicionar</button>
            </form>
        </section>

        <section aria-labelledby="list-heading">
            <table>
                <thead>
                    <tr>
                        <th>Itens</th>
                        <th>Valor</th>
                        <th>Qtd</th>
                    </tr>
                </thead>

                <tbody id="algum-id">

                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
